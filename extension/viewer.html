<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --paper:#FBFBFA; --ink:#2F3437; --ink-soft:#66655F; --ink-faint:#6F6E69; --rule:#EAEAEA; --accent:#1F6C9F;
    --sans:'SF Pro Text',-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif; --mono:'SF Mono',ui-monospace,Menlo,monospace; }
  @media (prefers-color-scheme: dark) { :root { --paper:#15161A; --ink:#E6E4DF; --ink-soft:#9D9C96; --ink-faint:#94938B; --rule:#2A2D34; --accent:#8CC2EC; } }
  html, body { margin:0; height:100%; background:var(--paper); color:var(--ink); font:15px/1.6 var(--sans); }
  #v { height:100%; }
  #v > iframe { display:block; width:100%; height:100%; border:0; }
  #v > img { display:block; max-width:100%; margin:0 auto; }
  #v > pre { margin:0; padding:24px; font:13px/1.5 var(--mono); white-space:pre-wrap; }
  article { max-width:68ch; margin:0 auto; padding:28px 28px 80px; overflow-wrap:break-word; }
  article img { max-width:100%; height:auto; }
  article table { border-collapse:collapse; } article td, article th { border:1px solid var(--rule); padding:4px 8px; }
  article a, .msg a { color:var(--accent); }
  .msg { padding:28px; color:var(--ink-soft); }
  .msg a { margin-right:16px; }
</style>
</head>
<body>
  <div id="v" data-state="loading"><p class="msg">Loading…</p></div>
  <script src="files.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
